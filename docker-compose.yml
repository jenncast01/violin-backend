services:
  violin-backend:
    build: .
    container_name: violin-backend
    ports:
      - "5000:5000"
    environment:
      - DB_PATH=violin_journey.db
      - JWT_SECRET=violin_journey_secret_key_2026
    volumes:
      - ./data:/app/data
    cap_add:
      - NET_ADMIN
      - NET_RAW

  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: nuclei-backend-scanner
    profiles:
      - scan
    volumes:
      - ./reports:/reports
    entrypoint: ["nuclei"]
    command:
      - "-target"
      - "http://violin-backend:5000"
      - "-severity"
      - "info,low,medium,high,critical"
      - "-jsonl-export"
      - "/reports/nuclei-results.jsonl"
